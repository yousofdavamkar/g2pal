<!-- ═══════════════════════════════════════════════════════════════════════════
     SCROLL-BOUND HERO SECTION
     Go2pal - Premium Fintech Hero
     
     Replace the existing <section class="relative pb-10 overflow-hidden pt-20 md:pt-28">
     with this entire block.
     ═══════════════════════════════════════════════════════════════════════════ -->

<section class="hero-scroll-section">
  <!-- Sticky Container -->
  <div class="hero-sticky-wrapper">
    
    <!-- Clean Background (Revealed after scroll) -->
    <div class="hero-clean-bg"></div>
    
    <!-- Animated Mesh Background -->
    <div class="hero-bg" aria-hidden="true">
      <div class="hero-bg-noise"></div>
    </div>
    
    <!-- Floating Particles -->
    <div class="hero-particles" aria-hidden="true">
      <div class="hero-particle"></div>
      <div class="hero-particle"></div>
      <div class="hero-particle"></div>
      <div class="hero-particle"></div>
      <div class="hero-particle"></div>
      <div class="hero-particle"></div>
      <div class="hero-particle"></div>
      <div class="hero-particle"></div>
      <div class="hero-particle"></div>
    </div>
    
    <!-- Main Content -->
    <div class="hero-content-wrapper">
      
      <!-- Subject Image (Girl with Phone) -->
      <div class="hero-subject">
        <img 
          src="/images/hero/hero-subject.png" 
          alt="اپلیکیشن گوتوپل - کیف پول دیجیتال" 
          class="hero-subject-image"
          width="500"
          height="700"
          loading="eager"
          fetchpriority="high"
        >
      </div>
      
      <!-- Text Content -->
      <div class="hero-text">
        
        <!-- News Badge -->
        <div class="hero-badge">
          <span class="hero-badge-dot"></span>
          <span>روز مرد مبارک ✨</span>
        </div>
        
        <!-- Main Heading -->
        <h1 class="hero-heading">
          <span class="hero-heading-gradient">با گوتوپل</span>
          <span class="hero-aurora-text">ساده استفاده کن</span>
          <span class="hero-heading-main">هوشمند مدیریت کن</span>
        </h1>
        
        <!-- Description -->
        <p class="hero-description">
          با گوتوپل می‌توانید به راحتی اکانت‌های سرگرمی و موسیقی بین‌المللی رو شارژ کنید. تجربه‌ای سریع، امن و با طراحی مدرن.
        </p>
        
        <!-- CTA Buttons -->
        <div class="hero-buttons">
          <a href="/application.html" class="hero-btn-primary">
            <span>ایجاد کیف پول گوتوپل</span>
            <svg class="icon flip-rtl" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </a>
          
          <button class="hero-btn-secondary" id="hero-video-btn">
            <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <span>مشاهده ویدیو</span>
          </button>
        </div>
        
      </div>
      
    </div>
    
    <!-- Scroll Indicator -->
    <div class="hero-scroll-indicator">
      <div class="hero-scroll-mouse">
        <div class="hero-scroll-wheel"></div>
      </div>
      <span>اسکرول کنید</span>
    </div>
    
  </div>
</section>

<!-- 
  ═══════════════════════════════════════════════════════════════════════════
  USAGE INSTRUCTIONS:
  ═══════════════════════════════════════════════════════════════════════════
  
  1. Add CSS to your main stylesheet:
     @import './hero-scroll.css';
     
     Or in style.css add:
     @import url('./hero-scroll.css');
  
  2. Add JS to your main.js:
     import { initHeroAnimation } from './js/hero-scroll.js';
     
     // Initialize on DOMContentLoaded
     document.addEventListener('DOMContentLoaded', initHeroAnimation);
  
  3. Place the hero image at:
     /public/images/hero/hero-subject.png
     
     The image should be a transparent PNG of the girl holding the phone.
     Recommended size: 1000x1400px (will be scaled down)
  
  4. Replace the existing hero section in index.html with this HTML block.
  
  ═══════════════════════════════════════════════════════════════════════════
-->
